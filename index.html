<!doctype html>
<html lang="en" class="dark">

<head>
  <!-- Hero Mode initialization - runs before paint to prevent flash -->
  <script>
    (function () {

      var hero = localStorage.getItem('hero_mode');
      if (hero === 'spiderman') {
        document.documentElement.classList.add('spiderman');
      } else if (hero === 'ironman') {
        document.documentElement.classList.add('ironman');
      } else if (hero === 'deadpool') {
        document.documentElement.classList.add('deadpool');
      } else if (hero === 'thor') {
        document.documentElement.classList.add('thor');
      } else if (hero === 'venom') {
        document.documentElement.classList.add('venom');
      } else if (hero === 'moonknight') {
        document.documentElement.classList.add('moonknight');
      } else if (hero === 'luffy') {
        // Luffy is the one daylight theme, so unlike every branch above it
        // has to shed 'dark' pre-paint too — the runtime toggler removes it
        // on click, but a hard refresh reads this class straight off the
        // static markup above, before React ever runs, and that markup is
        // hardcoded dark.
        document.documentElement.classList.add('luffy');
        document.documentElement.classList.remove('dark');
      } else if (!hero) {
        var oldSpidey = localStorage.getItem('spidey_mode');
        if (oldSpidey === 'true') {
          document.documentElement.classList.add('spiderman');
          localStorage.setItem('hero_mode', 'spiderman');
        }
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Thenushan — Software Engineer & Digital Experience Builder</title>
  <meta name="description"
    content="Thenushan is a software engineer who designs and develops intelligent, scalable, and immersive digital products — specialising in React, TypeScript, AI, and full-stack development." />
  <meta name="keywords"
    content="Software Engineer, React Developer, TypeScript, Full Stack, AI, Portfolio, Thenushan" />
  <meta name="author" content="Thenushan" />

  <!-- Open Graph -->
  <meta property="og:title" content="Thenushan — Software Engineer" />
  <meta property="og:description"
    content="I design and develop intelligent, scalable, and immersive digital products." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
