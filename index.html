<!doctype html>
<html lang="en">

<head>
  <!-- Theme initialization - runs before paint to prevent flash -->
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
      } else if (theme === 'dark' || !window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      if (localStorage.getItem('spiderman') === 'on') {
        document.documentElement.classList.add('spiderman');
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
